<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaoMind · Browser Check</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#faf8f2;color:#2c2417;
       margin:0;padding:20px;line-height:1.5}
  h1{font-size:18px;margin:0 0 4px}
  .hint{color:#6f6350;font-size:13px;margin-bottom:16px}
  .card{background:#fffdf8;border:1px solid #e8e2d4;border-radius:10px;padding:14px;margin-bottom:12px}
  .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#9a7b4f;margin-bottom:5px}
  .v{font-size:13px;word-break:break-all;font-family:ui-monospace,Menlo,monospace}
  .big{font-size:15px;font-weight:600;color:#b03a2e}
  .verdict{font-size:14px;padding:12px;border-radius:8px;margin-bottom:14px}
  .ok{background:#e8f3ea;border:1px solid #b8d9bf}
  .bad{background:#fdecea;border:1px solid #e8b4ad}
</style>
</head>
<body>
<h1>TaoMind · Browser Check</h1>
<p class="hint">Open this in Safari, then again inside Threads. Compare the two.</p>

<div id="verdict" class="verdict bad">Checking…</div>

<div class="card">
  <div class="k">Detected in-app browser</div>
  <div class="v big" id="inapp">…</div>
</div>

<div class="card">
  <div class="k">userAgent</div>
  <div class="v" id="ua">…</div>
</div>

<div class="card">
  <div class="k">Can open itms-appss:// ?</div>
  <div class="v" id="scheme">not tested</div>
</div>

<script>
var ua = navigator.userAgent || '';
var re = /FBAN|FBAV|FB_IAB|Instagram|Threads|Barcelona|TikTok|BytedanceWebview|Line\//i;
var m = ua.match(re);
document.getElementById('ua').textContent = ua;
document.getElementById('inapp').textContent = m ? ('YES — matched "' + m[0] + '"') : 'no match';

var v = document.getElementById('verdict');
if (m) {
  v.className = 'verdict ok';
  v.textContent = 'In-app browser detected (' + m[0] + '). The handler on the home page should be active.';
} else {
  v.className = 'verdict bad';
  v.textContent = 'No in-app browser matched. If you are inside Threads right now, the home-page handler never fires — this is the bug.';
}

// Probe whether this container can hand off to the App Store scheme at all.
// A blocked scheme usually leaves the page visible; a working one navigates away.
document.getElementById('scheme').textContent = 'testing… (page will leave if it works)';
setTimeout(function(){
  try { window.location.href = 'itms-appss://apps.apple.com/app/id6792008756'; } catch (e) {
    document.getElementById('scheme').textContent = 'threw: ' + e.message;
  }
}, 1200);
</script>
</body>
</html>
